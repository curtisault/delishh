<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The install. The manifest is generated from theme.css by
         `deno task content`; iOS ignores its icons and reads
         apple-touch-icon instead. The two theme-color metas are the
         site bar's --stencil-bg in each lighting, so the system bar
         above it reads as the bar's continuation; they are the one
         place a hex sits outside theme.css, and scripts/pwa_test.ts
         holds both to it. boot.js repaints them from the computed
         token when the reader picks a lighting explicitly. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#12150e"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#e4e9e6"
    />
    <!-- The three faces on screen before anything is scrolled: the
         masthead and labels (display), the prose under them (body),
         and the § marks and numerals (data). Served from public/fonts,
         so these paths are stable — Vite copies public/ verbatim and
         does not hash it. `crossorigin` is required even same-origin:
         fonts are fetched in CORS mode, and without it the preload is
         discarded and fetched twice.

         Only the 400 cut of the data voice is preloaded. 700 carries
         quantities and step numbers, so preloading it was tried and
         REVERTED: the symptom that prompted it — blank amounts in a
         headless screenshot — turned out to be the headless browser
         not rendering the data voice at all, not a swap-period flash.
         `font-display: swap` already covers the real case with a
         fallback rather than invisibility, and 22 kB of render-
         blocking fetch is not worth a brief FOUT on a phone in a
         kitchen (DS-01 §12).

         Instrument Serif is deliberately NOT here. The human voice
         appears in asides and in a recipe's note at the foot of the
         document — never above the fold — so preloading it would buy
         21 kB of nothing on a phone in a kitchen (DS-01 §12).

         Swap a face and its line swaps with it. -->
    <link
      rel="preload"
      href="/fonts/archivo-expanded-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-500-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>DELISHH</title>
    <meta name="description" content="A personal recipe archive: browse, search, filter, print." />
  </head>
  <body>
    <!-- No mount node: Browser.application takes the body. The <title>
         above is pre-boot only — Route.title owns it once Elm starts,
         and the home route's title matches it so the swap is invisible. -->
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
